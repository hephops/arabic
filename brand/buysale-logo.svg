<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 206" role="img" aria-label="BuySale">
  <title>BuySale</title>
  <!-- Gorizontal qulf: belgi + nom. Sayt sarlavhasi va hujjat uchun. -->
  <g transform="translate(0,-8)">
<!-- Yashil: savat dastasi va qiya tushgan devori, u "B" ga aylanadi.
       Ko'k: "S" — yuqori chizig'i o'ngga cho'zilgan, ikkala uchi qiya
       kesilgan (yuqori o'ng va pastki chap). -->
<g fill="none" stroke-width="88" stroke-linejoin="round">
    <g stroke="#12B24A" stroke-linecap="round">
      <path d="M96 333 H228 C272 333 292 366 300 416 L378 762"/>
      <path d="M305 437 H600 C682 437 682 600 600 600 H341"/>
      <path d="M341 600 H620 C702 600 702 762 620 762 H378"/>
    </g>
    <g stroke="#1546E8" stroke-linecap="butt">
      <path d="M1150 440 H800 C750 440 750 600 800 600 H1042 C1094 600 1094 757 1042 757 H748"/>
    </g>
  </g>
  <path d="M1150 396 H1198 L1150 484 Z" fill="#1546E8"/>
  <path d="M748 713 V801 L700 801 Z" fill="#1546E8"/>
  <circle cx="452" cy="886" r="68" fill="#12B24A"/>
  <circle cx="940" cy="886" r="68" fill="#1546E8"/>
  </g>
  <text x="352" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-4">
    <tspan fill="#0E1B33">Buy</tspan><tspan fill="#1546E8">Sale</tspan>
  </text>
</svg>
